services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acma_dev_password}
      POSTGRES_DB: acma_store
    ports:
      - "5433:5432"
    volumes:
      - acma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acma -d acma_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acma_pgdata:
